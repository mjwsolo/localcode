[build-system]
requires = ["setuptools>=69", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localcode"
version = "0.2.11rc9"
description = "High-performance AI coding on consumer hardware."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "LocalCode" }
]
keywords = ["ai", "cli", "coding-assistant", "gemma", "local-first", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "certifi>=2024.0.0",
  "duckduckgo-search>=6.2.0",
  "httpx>=0.27.0",
  "jedi>=0.19.0",
  "prompt_toolkit>=3.0.43",
  "rich>=13.7.1",
  "scikit-learn>=1.3.0",
  "textual>=8.0.0",
  "tomli>=2.0.0;python_version<'3.11'",
]


[project.urls]
Homepage = "https://github.com/mjwsolo/localcode"
Documentation = "https://github.com/mjwsolo/localcode/tree/main/docs"
Repository = "https://github.com/mjwsolo/localcode"
Issues = "https://github.com/mjwsolo/localcode/issues"

[project.scripts]
localcode = "gem.cli:main"
lc = "gem.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gem" = ["**/*.tcss", "bin/llama-server", "bin/*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
