[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-tui"
version = "0.1.0"
description = "Gem is a local-first AI coding assistant TUI for Gemma 4."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Gem Contributors" }
]
dependencies = [
  "duckduckgo-search>=6.2.0",
  "httpx>=0.27.0",
  "prompt_toolkit>=3.0.43",
  "rich>=13.7.1",
]

[project.scripts]
localcode = "gem.cli:main"
lc = "gem.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
