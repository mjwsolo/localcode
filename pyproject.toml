[build-system]
requires = ["setuptools>=69", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localcode"
version = "0.3.29"
description = "High-performance AI coding on consumer hardware."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "LocalCode contributors" }
]
keywords = ["ai", "cli", "coding-assistant", "gemma", "local-first", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "certifi>=2024.0.0",
  "ddgs>=9.0.0",
  "hf_xet>=1.1.0",            # Rust download backend for huggingface_hub ≥1.x (replaced hf_transfer)
  "httpx>=0.27.0",
  "huggingface_hub>=1.0.0",   # used as the fast path for GGUF downloads
  "jedi>=0.19.0",
  "mcp>=1.28.0",              # official Model Context Protocol SDK (stdio/HTTP/SSE + OAuth)
  "prompt_toolkit>=3.0.52",
  "rich>=13.7.1",
  "scikit-learn>=1.3.0",
  "textual>=8.2.4",
  "tree-sitter>=0.23.0",              # in-process, offline syntax checking (Tier-1 verify)
  "tree-sitter-language-pack>=1.0.0", # bundled grammars, 100+ languages, no external tools
  "tomli>=2.0.0;python_version<'3.11'",
]

[project.optional-dependencies]
voice = [
  "pywhispercpp>=1.2.0",      # whisper.cpp wheel w/ prebuilt Metal binary (STT)
  "sounddevice>=0.4.6",       # microphone capture + Piper audio output
  "numpy>=1.26.0",
  "piper-tts>=1.2.0",         # natural neural TTS — default speaker
]


[project.urls]
Homepage = "https://github.com/mjwsolo/localcode"
Documentation = "https://mjwsolo.github.io/localcode/"
Repository = "https://github.com/mjwsolo/localcode"
Issues = "https://github.com/mjwsolo/localcode/issues"

[project.scripts]
localcode = "localcode.entrypoint:main"
lc = "localcode.entrypoint:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"localcode" = ["**/*.tcss", "bin/llama-server", "skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Exclude the real-inference tier from the default run; opt in with
# `pytest -m real_models` (a command-line -m overrides this). CI runs the
# CI-safe glob `tests/test_comprehensive_*.py`, which doesn't include it.
addopts = "-q -m 'not real_models'"
# Put repo root + src on sys.path so `from tests.e2e...` and `from
# localcode...` resolve under a bare `pytest` invocation (CI), not just
# `python -m pytest` (which adds CWD itself).
pythonpath = [".", "src"]
markers = [
  "slow: heavyweight tests (real venv install, network) — opt-in, skipped by default",
  "real_models: load a downloaded GGUF and run a real inference turn — opt-in (`-m real_models`), auto-skipped when the model file is absent (so CI skips).",
]

[tool.ruff]
line-length = 100
target-version = "py311"
