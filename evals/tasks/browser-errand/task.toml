id = "browser-errand"
quality = "capability"          # capability | reliability | safety_scope | efficiency | fidelity
component = "harness"
purpose = "tracking"          # regression | tracking
turns = 1
trials = 1
require_all_trials = false
budget_steps = 25
budget_seconds = 900
allowed_paths = ['answer.txt', 'site/**']
null_passes = false
notes = ""
setup = "cd site && python3 server.py 18555 > server.log 2>&1 &"
teardown = "pkill -f 'server.py 18555' || true"
mcp = {"browser" = {"type" = "local", "command" = ["npx", "-y", "@playwright/mcp@latest", "--headless", "--browser", "chromium", "--isolated"]}}
