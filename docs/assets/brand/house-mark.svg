<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="localcode">
  <title>localcode House Mark</title>
  <!--
    House Mark — the repository's existing logo redrawn as flat geometry.

    LINEAGE. docs/assets/logo/{light,dark}.png uses the 🏠 emoji, whose glyph is
    rendered by the OS and so changes shape between Apple, Google, Microsoft and
    Android. This keeps what makes that logo recognisable — the overhanging
    gable, the chimney, the square body, the four-pane window on the left, the
    doorway on the right — and drops what is platform-dependent: the bevels,
    highlights, drop shadow, grass, and the emoji colour scheme.

    CONTAINMENT. The window is the "local" idea made literal: a frame with one
    pane lit in the brand accent. It is deliberately the same construction as
    the Finder Mark, frame plus offset solid core, and the lit pane sits in the
    bottom-right quadrant so the offset runs down-and-right in both marks. They
    read as one family rather than as two logos.

    CONSTRUCTION. 32-unit grid, 2.5 stroke on the silhouette and 2 on the window
    so the mullions stay open at small sizes. Roof slope is a single constant
    (11.5 rise over 14 run) shared by both eaves; the chimney's two verticals
    terminate exactly on that line. Strokes inherit currentColor; the lit pane
    reads the mark-core custom property, falling back to brand blue.
  -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- chimney: verticals stop on the roof line at x=7 (y=10.9) and x=11 (y=7.6) -->
    <path d="M7 10.9 V4.5 H11 V7.6"/>
    <!-- gable, overhanging the walls on both sides -->
    <path d="M2 15 L16 3.5 L30 15"/>
    <!-- body: open at the top, where the roof covers it -->
    <path d="M5 12.5 V29 H27 V12.5"/>
    <!-- doorway: open at the base -->
    <path d="M20 29 V19.5 H26 V29"/>
  </g>
  <!-- window: one lit pane, then the frame and mullions over it -->
  <rect x="12.5" y="21.5" width="4.5" height="4.5" fill="var(--lc-mark-core, #2457E6)"/>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="8" y="17" width="9" height="9"/>
    <path d="M12.5 17 V26 M8 21.5 H17"/>
  </g>
</svg>
