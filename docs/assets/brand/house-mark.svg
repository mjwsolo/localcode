<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" stroke="currentColor" stroke-width="2.5"
     stroke-linecap="square" stroke-linejoin="miter"
     role="img" aria-label="localcode">
  <title>localcode House Mark</title>
  <!-- A pentagonal enclosure containing a terminal prompt. The house is the
       boundary the process does not cross, not a dwelling: no door, window,
       chimney or eave overhang; 33.7° pitch; footprint wider than tall. The
       block cursor is the offset core carried over from the previous mark. -->
  <path d="M4 27V13L16 5L28 13V27Z"/>
  <path d="M11 17.5L13.5 20L11 22.5"/>
  <rect x="17" y="17.5" width="5" height="5" fill="var(--lc-mark-core, currentColor)" stroke="none"/>
</svg>
