<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" stroke="currentColor" stroke-width="2.5"
     stroke-linecap="square" stroke-linejoin="miter"
     role="img" aria-label="localcode">
  <title>localcode House Mark</title>
  <!--
    House Mark — a pentagonal enclosure containing a terminal prompt.

    The house is the boundary the process does not cross, not a dwelling: no
    door, no window, no chimney, no eave overhang. Roof pitch is 33.7° (a
    "home" icon is 45°) and the footprint is 24×22 — wider than tall — because
    home glyphs are square or tall. Miter joins, square caps: round joins read
    domestic.

    The 5×5 block cursor is the offset solid core carried over from the
    previous Finder Mark, so the two marks are one lineage.

    32-unit grid, every edge on a 0.5 step. Strokes inherit currentColor; the
    cursor reads --lc-mark-core and falls back to currentColor so the mark is
    genuinely monochrome unless a theme opts in.

    Below 20px use house-mark-compact.svg instead — the caret closes up.
  -->
  <path d="M4 27V13L16 5L28 13V27Z"/>
  <path d="M11 17.5L13.5 20L11 22.5"/>
  <rect x="17" y="17.5" width="5" height="5" fill="var(--lc-mark-core, currentColor)" stroke="none"/>
</svg>
