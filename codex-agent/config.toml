# localcode's Codex profile. Used via CODEX_HOME, never ~/.codex — a user's own
# codex install is untouched.

model = "Qwen3.8-27B-UD-Q4_K_XL"
model_provider = "localcode"

# Local inference only. The turboquant llama-server speaks the Responses API
# (/v1/responses), which is the only wire codex supports since chat was removed.
# localcode's promise: asks before anything risky. codex has a real approval
# system built in — configure it rather than port ours.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Hidden thinking is switched off on the SERVER (server_cmd.py adds
# --reasoning off --reasoning-budget 0), one switch for every wire and model.
# No per-request reasoning effort here: it silently failed on Muse Glimmer.

# Model metadata so codex stops warning and sizes context correctly.
model_context_window = 32768
model_max_output_tokens = 8192

# The workspace-write sandbox blocks ALL network by default, so npm install /
# pip install / git fetch fail with ENOTFOUND (and headless runs can't approve
# an escape). Local inference is the privacy promise; the agent's own tools
# may use the network like any developer's shell would.
[sandbox_workspace_write]
network_access = true

# Provider table LAST: any key after a [table] header belongs to that table,
# which is how approval/sandbox/thinking settings silently went missing before.
[model_providers.localcode]
name = "localcode"
base_url = "http://127.0.0.1:8123/v1"
wire_api = "responses"
env_key = "LOCALCODE_API_KEY"

# localcode planning discipline. codex ships update_plan DISABLED unless this
# table is present: without it the tool is not offered and the planning
# guidance is stripped from the system prompt (it made zero plan calls in a
# 110-request run). With it, the fork's open-todo gate refuses to end a turn
# while plan items are still open — the way localcode's own loop works.
[tools.update_plan]
enabled = true

# view_image returns the picture as an image tool output. llama-server's
# /v1/responses rejects that ("Output of tool call should be 'Input text'",
# HTTP 400) and the whole turn dies — a 58-minute Qwen run ended that way
# right after generating its PWA icons. Off until the server accepts it.
[features]
view_image = false
