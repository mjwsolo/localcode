name: Dedicated runners

# Three model architectures cannot be loaded by the bundled TurboQuant
# llama-server - diffusion_gemma, cohere2moe, muse_glimmer - so each needs its
# own binary built from a pinned llama.cpp commit. Building those on the user's
# Mac needs Xcode CLT + cmake and takes minutes, which breaks the "pick a model,
# it runs" promise. This workflow builds them here instead, so bootstrap.py can
# download a verified prebuilt and only fall back to a source build.
#
# Every runner is asserted self-contained the same way turboquant.yml does it:
# BUILD_SHARED_LIBS=OFF + embedded Metal library, then otool -L must not name
# /opt/homebrew. A binary that picks up Homebrew libs is broken for most users.
#
# The commit pins are READ OUT OF src/localcode/bootstrap.py, never duplicated
# here: a workflow that built a different vintage than the one the client
# expects would ship a binary whose checksum can never match its pin.

on:
  push:
    branches: [main]
    paths:
      - 'src/localcode/bootstrap.py'
      - '.github/workflows/runners.yml'
  pull_request:
    paths:
      - 'src/localcode/bootstrap.py'
      - '.github/workflows/runners.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the runners to (e.g. runners-v1). Leave empty to only upload artifacts.'
        required: false
        type: string

concurrency:
  group: runners-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} (macos-arm64)
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: llama-diffusion-cli
            pin_var: _DIFFUSION_PR_SHA
            target: llama-diffusion-cli
            built: build/bin/llama-diffusion-cli
          - name: llama-server-cohere
            pin_var: _COHERE_PIN_SHA
            target: llama-server
            built: build/bin/llama-server
          - name: llama-server-muse
            pin_var: _MUSE_PIN_SHA
            target: llama-server
            built: build/bin/llama-server
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned llama.cpp commit
        id: pin
        # Single source of truth: the same constant the client verifies against.
        run: |
          sha=$(python3 - <<'PY'
          import re
          src = open("src/localcode/bootstrap.py").read()
          m = re.search(r'^${{ matrix.pin_var }}\s*=\s*"([0-9a-f]{40})"', src, re.M)
          assert m, "pin ${{ matrix.pin_var }} not found in bootstrap.py"
          print(m.group(1))
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building ${{ matrix.name }} from llama.cpp $sha"

      - name: Fetch the pinned commit
        run: |
          mkdir -p llama.cpp && cd llama.cpp
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "${{ steps.pin.outputs.sha }}"
          git checkout --force "${{ steps.pin.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"

      - name: Configure
        working-directory: llama.cpp
        # Same flags bootstrap.py uses. BUILD_SHARED_LIBS=OFF and the embedded
        # Metal library are what make the artifact shippable at all: without
        # them cmake emits a ~50 KB stub linked against @rpath dylibs in the
        # build tree. LLAMA_CURL=OFF keeps it off Homebrew's libcurl.
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_CURL=OFF

      - name: Build
        working-directory: llama.cpp
        run: cmake --build build --config Release -j 4 --target ${{ matrix.target }}

      - name: Assert the binary is self-contained
        working-directory: llama.cpp
        # This binary is downloaded and executed on machines with no Homebrew
        # and no toolchain. Homebrew linkage means it will not start there.
        run: |
          test -x "${{ matrix.built }}"
          if otool -L "${{ matrix.built }}" | grep -q "/opt/homebrew"; then
            echo "binary links Homebrew libraries:"
            otool -L "${{ matrix.built }}" | grep "/opt/homebrew"
            exit 1
          fi
          otool -L "${{ matrix.built }}"

      - name: Stage the release asset
        run: |
          mkdir -p dist
          cp "llama.cpp/${{ matrix.built }}" "dist/${{ matrix.name }}-macos-arm64"
          chmod +x "dist/${{ matrix.name }}-macos-arm64"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-macos-arm64
          path: dist/${{ matrix.name }}-macos-arm64
          if-no-files-found: error
          retention-days: 14

  publish:
    name: checksums + release assets
    needs: build
    runs-on: macos-14
    # Only on a real release, or a manual run that named a tag.
    if: github.event_name == 'release' || inputs.tag != ''
    permissions:
      contents: write
    steps:
      - name: Download the built runners
        uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Emit SHA256SUMS
        # These are the values that go into _RUNNER_PREBUILT_SHA256 in
        # bootstrap.py. Until they are pinned there, the client refuses to
        # download and builds from source instead.
        run: |
          cd staging
          chmod +x llama-*
          shasum -a 256 llama-* | tee SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          cd staging
          gh release upload "$TAG" llama-* SHA256SUMS --clobber \
            --repo "${{ github.repository }}"
