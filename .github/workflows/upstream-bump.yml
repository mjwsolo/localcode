name: Upstream bump
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: llama.cpp ref to test
        default: master
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: upstream-llama
  cancel-in-progress: false
jobs:
  candidate:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: ./.github/workflows/upstream-candidate.yml
    with:
      kind: llama
      ref: ${{ inputs.ref || 'master' }}
