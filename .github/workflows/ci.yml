name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same ref, so a
# superseded run can't linger and report a confusing red ✗.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Required gate: the comprehensive suite must pass on every push ──
  # Fast, deterministic, no model download. Covers agent loop + tools,
  # CLI, live TUI, vision, audio logic, the RAM-size matrix, and download
  # orchestration. Linux-safe (TUI headless; voice/Metal mocked; the
  # real-whisper / real-install / real-download tests are gated off here).
  comprehensive:
    name: comprehensive (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-timeout ruff
      - name: Lint (syntax / undefined-name errors only)
        run: ruff check --select E9,F63,F7,F82 src tests
      - name: Comprehensive tests
        # --timeout turns any future hang into a diagnosable per-test failure
        # instead of an opaque runner SIGTERM (exit 143). Linux tests are all
        # fast (mocked/pure-Python); 120s is a generous ceiling.
        run: pytest tests/test_comprehensive_*.py -v --timeout=120

  # ── Same gate on macOS arm64 — users run Apple Silicon, so we test the
  # real platform. Also exercises the REAL fresh-venv install (packaging)
  # since that's cheap and catches Mac-specific packaging gaps. The
  # real-whisper test stays gated (needs a 540 MB model download).
  comprehensive-macos:
    name: comprehensive (macos-arm64)
    runs-on: macos-14            # macos-14 runners are Apple Silicon (M1)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Comprehensive tests (+ real isolated install)
        env:
          LOCALCODE_RUN_INSTALL_TEST: "1"   # real pip-install-into-venv smoke
        run: pytest tests/test_comprehensive_*.py -v

  # ── Packaging must always build ──
  packaging:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build cython wheel setuptools
      - run: python -m build

  # NOTE: the old "legacy suite (non-blocking)" job was removed — even with
  # continue-on-error it surfaced a red ✗ in the checks list (noise). The 8
  # remaining pre-existing failures (test_runtime 16 GB-context / custom-
  # binary, test_architecture guardrails) are tracked in TESTING.md "Legacy
  # test triage" and can be run locally with:
  #   pytest --ignore-glob='tests/test_comprehensive_*.py' tests/
