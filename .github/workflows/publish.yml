name: Build & Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-timeout ruff
      - run: ruff check --select E9,F63,F7,F82 src tests
      - run: pytest tests/test_comprehensive_*.py -q --timeout=120
      - name: Agent harness regression tests
        run: |
          pytest -q \
            tests/test_agent_state_machine.py \
            tests/test_evidence_and_lifecycle_hooks.py \
            tests/test_execution_policies.py \
            tests/test_code_navigation_and_processes.py

  # LocalCode has no compiled Python extensions; the llama-server and
  # diffusion binaries are checked in under src/localcode/bin/ and ride
  # along as package data (see .github/workflows/turboquant.yml for how
  # they are built and checked). So a normal wheel + sdist via
  # `python -m build` is right. No cibuildwheel — that is for packages
  # with compiled extensions, and it errors out ("pure Python wheel
  # generated") here.
  build:
    name: Build wheel + sdist
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: Build (pure-Python wheel + sdist)
        run: python -m build
      - name: Show artifacts
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
