name: Build & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # LocalCode is a pure-Python package (the llama-server binary is fetched
  # at runtime, not bundled), so we build a normal wheel + sdist with
  # `python -m build`. No cibuildwheel — that's for packages with compiled
  # extensions, and it errors out ("pure Python wheel generated") here.
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: Build (pure-Python wheel + sdist)
        run: python -m build
      - name: Show artifacts
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
