name: Build & Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # full history so the on-main check below works
      # Refuse to publish a commit that is not on main. Without this, tagging a
      # feature/integration branch directly would publish to PyPI without the
      # code ever landing on main. The proper flow is: merge to main, THEN tag.
      - name: Release commit must be on main
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is an ancestor of origin/main."
          else
            echo "::error::Release commit $GITHUB_SHA ($GITHUB_REF_NAME) is not on main. Merge to main before tagging/releasing."
            exit 1
          fi
      - name: Tag must equal the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          f="$(sed -n 's/^    __version__ = "\(.*\)"/\1/p' src/localcode/__init__.py | head -1)"
          echo "pyproject=$v fallback=$f tag=$GITHUB_REF_NAME"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != pyproject version $v"; exit 1; }
          [ "$v" = "$f" ] || { echo "::error::__init__ fallback version $f != pyproject $v"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-timeout ruff
      - run: ruff check --select E9,F63,F7,F82 src tests
      - run: pytest tests/test_comprehensive_*.py tests/test_ui_auth.py tests/test_ui_api.py tests/test_ui_launch.py -q --timeout=120

  # LocalCode has no compiled Python extensions; the two shipped binaries
  # (llama-server and the localcode-ui runtime) are checked in under
  # src/localcode/bin/ and ride along as package data in a macosx_13_0_arm64 wheel (see .github/workflows/turboquant.yml for how
  # it is built and checked). So a normal wheel + sdist via
  # `python -m build` is right. No cibuildwheel — that is for packages
  # with compiled extensions, and it errors out ("pure Python wheel
  # generated") here.
  build:
    name: Build wheel + sdist
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: Clean stale build artifacts
        # A leftover build/ or *.egg-info from a prior (local or cached) build can
        # leak files into the wheel that are no longer in the source tree. A fresh
        # CI checkout is normally clean, so this is belt-and-braces, but it is the
        # exact failure that shipped stale binaries in a local build once.
        run: rm -rf build dist src/*.egg-info
      - name: Build (pure-Python wheel + sdist)
        run: python -m build
      - name: Show artifacts
        run: ls -l dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # The GitHub release is created from the same tag, with the notes taken from
  # the CHANGELOG section for that version (scripts/release_notes.py), and the
  # wheel and sdist attached. Only on a tag push: creating the release fires a
  # `release: published` event that re-runs this workflow, and that run must not
  # try to create it again.
  github-release:
    name: GitHub release
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" --check > notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          pre=""
          if [[ "${tag#v}" =~ [a-zA-Z] ]]; then pre="--prerelease"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md $pre
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md $pre --verify-tag
          fi

  verify-published:
    name: Verify published PyPI install
    needs: [publish]
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        installer: [pip, uv]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - name: Verify exact published version and upgrade
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python scripts/verify_install.py --target "localcode==$version" --expected "$version" --installer "$INSTALLER" --from-version 0.4.9
