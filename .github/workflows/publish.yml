name: Build & Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the on-main check below works
      # Refuse to publish a commit that is not on main. Without this, tagging a
      # feature/integration branch directly would publish to PyPI without the
      # code ever landing on main. The proper flow is: merge to main, THEN tag.
      - name: Release commit must be on main
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is an ancestor of origin/main."
          else
            echo "::error::Release commit $GITHUB_SHA ($GITHUB_REF_NAME) is not on main. Merge to main before tagging/releasing."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-timeout ruff
      - run: ruff check --select E9,F63,F7,F82 src tests
      - run: pytest tests/test_comprehensive_*.py -q --timeout=120
      - name: Agent harness regression tests
        run: |
          pytest -q \
            tests/test_agent_state_machine.py \
            tests/test_evidence_and_lifecycle_hooks.py \
            tests/test_execution_policies.py \
            tests/test_code_navigation_and_processes.py

  # LocalCode has no compiled Python extensions; the llama-server binary
  # (the one shipped binary) is checked in under src/localcode/bin/ and rides
  # along as package data (see .github/workflows/turboquant.yml for how
  # it is built and checked). So a normal wheel + sdist via
  # `python -m build` is right. No cibuildwheel — that is for packages
  # with compiled extensions, and it errors out ("pure Python wheel
  # generated") here.
  build:
    name: Build wheel + sdist
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: Clean stale build artifacts
        # A leftover build/ or *.egg-info from a prior (local or cached) build can
        # leak files into the wheel that are no longer in the source tree. A fresh
        # CI checkout is normally clean, so this is belt-and-braces, but it is the
        # exact failure that shipped stale binaries in a local build once.
        run: rm -rf build dist src/*.egg-info
      - name: Build (pure-Python wheel + sdist)
        run: python -m build
      - name: Show artifacts
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
