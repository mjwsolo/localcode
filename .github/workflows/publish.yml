name: Build & Publish to PyPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize tag, manual and release-event runs; never cancel a publish halfway.
concurrency:
  group: localcode-publish
  cancel-in-progress: false

env:
  LOCALCODE_REQUIRE_INTEGRATION: "1"

jobs:
  intent:
    name: Detect release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check for a version bump or explicit release event
        id: intent
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/release_intent.py --event "$EVENT" --ref "$GITHUB_REF" --before "$BEFORE" >> "$GITHUB_OUTPUT"

  test:
    needs: [intent]
    if: needs.intent.outputs.publish == 'true'
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      # A final tag on the commit that was tested as <final>rcN: the build rewrites the version.
      promoted: ${{ steps.identity.outputs.promoted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # full history so the on-main check below works
      # Refuse to publish a commit that is not on main. Without this, tagging a
      # feature/integration branch directly would publish to PyPI without the
      # code ever landing on main. The proper flow is: merge to main, THEN tag.
      - name: Release commit must be on main
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is an ancestor of origin/main."
          else
            echo "::error::Release commit $GITHUB_SHA ($GITHUB_REF_NAME) is not on main. Merge to main before tagging/releasing."
            exit 1
          fi
      - name: Resolve and validate release identity
        id: identity
        run: python3 scripts/release_identity.py --ref "$GITHUB_REF" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Require changelog notes before publishing
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          PROMOTED: ${{ steps.identity.outputs.promoted }}
        run: python3 scripts/release_notes.py "$VERSION" --check ${PROMOTED:+--promoted} > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-timeout ruff
      - run: ruff check --select E9,F63,F7,F82 src tests
      - run: pytest tests/test_release_identity.py tests/test_release_intent.py tests/test_comprehensive_*.py tests/test_ui_auth.py tests/test_ui_api.py tests/test_ui_launch.py -q --timeout=120

  # LocalCode has no compiled Python extensions; the two shipped binaries
  # (llama-server and the localcode-ui runtime) are checked in under
  # src/localcode/bin/ and ride along as package data in a macosx_13_0_arm64 wheel (see .github/workflows/turboquant.yml for how
  # it is built and checked). So a normal wheel + sdist via
  # `python -m build` is right. No cibuildwheel — that is for packages
  # with compiled extensions, and it errors out ("pure Python wheel
  # generated") here.
  build:
    name: Build wheel + sdist
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: Clean stale build artifacts
        # A leftover build/ or *.egg-info from a prior (local or cached) build can
        # leak files into the wheel that are no longer in the source tree. A fresh
        # CI checkout is normally clean, so this is belt-and-braces, but it is the
        # exact failure that shipped stale binaries in a local build once.
        run: rm -rf build dist src/*.egg-info
      - name: Promoted candidate - set the final version in this build tree only
        # A final tag (v0.5.41) on the commit tested as 0.5.41rc1 publishes that exact
        # commit. Nothing is committed: main keeps the rc string until the next release.
        # The bundled localcode-ui binary is committed, not rebuilt here, so its footer
        # shows the version it was last built with, as for every release.
        if: needs.test.outputs.promoted == 'true'
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: python3 scripts/release_promote.py "$VERSION"
      - name: Build (pure-Python wheel + sdist)
        run: python -m build
      - name: Show artifacts
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          ls -l dist/
          ls dist/ | grep -q "^localcode-${VERSION}[-.]" || { echo "::error::built files do not carry version ${VERSION}"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Every successful publishing path gets the same tag, notes and artifacts.
  # A manual publish creates its missing tag; an existing tag is never moved.
  github-release:
    name: GitHub release
    needs: [test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Ensure matching tag exists
        env:
          RELEASE_TAG: ${{ needs.test.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            actual=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            expected=$(git rev-parse "$GITHUB_SHA^{commit}")
            [ "$actual" = "$expected" ] || { echo "::error::Release tag points to another commit"; exit 1; }
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.test.outputs.version }}
          PROMOTED: ${{ needs.test.outputs.promoted }}
        run: |
          python3 scripts/release_notes.py "$VERSION" --check ${PROMOTED:+--promoted} > notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.test.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          pre=""
          if [[ "${tag#v}" =~ [a-zA-Z] ]]; then pre="--prerelease"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md --draft=false $pre
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md $pre --verify-tag
          fi

      - name: Verify published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.test.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path("release.json").read_text())
          assert release["tagName"] == os.environ["RELEASE_TAG"]
          assert release["isDraft"] is False
          expected = {p.name for p in Path("dist").iterdir() if p.is_file()}
          actual = {p["name"] for p in release["assets"]}
          assert expected and expected <= actual, "Release artifacts are missing"
          PY

  verify-published:
    name: Verify published PyPI install
    needs: [test, publish]
    env:
      # From the release identity: a promoted candidate's checkout still says <final>rcN.
      PUBLISHED_VERSION: ${{ needs.test.outputs.version }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        installer: [pip, uv]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - name: Wait for PyPI to index the release
        # Upload returns before the index and CDN serve the new version; a
        # fresh pip/uv resolve a few seconds later still sees the old one.
        run: |
          version="$PUBLISHED_VERSION"
          for i in $(seq 1 40); do
            if curl -fsS "https://pypi.org/simple/localcode/" | grep -q "localcode-${version}-" \
               && curl -fsS "https://pypi.org/pypi/localcode/${version}/json" >/dev/null; then
              echo "localcode ${version} is on the index after $((i * 15 - 15))s"; exit 0
            fi
            sleep 15
          done
          echo "::error::localcode ${version} not on the PyPI index after 10 minutes"; exit 1
      - name: Verify exact published version and upgrade
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          version="$PUBLISHED_VERSION"
          python scripts/verify_install.py --target "localcode==$version" --expected "$version" --installer "$INSTALLER" --from-version 0.4.9
      # The package users get, not the checkout: a fresh venv and a fresh HOME,
      # the exact version PyPI now serves, then the product's own checks.
      - name: Install the published version into a fresh venv
        if: matrix.installer == 'pip'
        run: |
          version="$PUBLISHED_VERSION"
          work="$RUNNER_TEMP/published"
          rm -rf "$work"; mkdir -p "$work/home"
          python -m venv "$work/venv"
          for i in 1 2 3 4 5 6; do
            "$work/venv/bin/python" -m pip install --quiet --no-cache-dir "localcode==$version" && break
            [ "$i" = 6 ] && { echo "::error::could not install localcode==$version"; exit 1; }
            sleep 30
          done
          echo "PUBLISHED_WORK=$work" >> "$GITHUB_ENV"
          # A release candidate must not become what a plain `pip install localcode` picks.
          if [[ "$version" =~ [a-zA-Z] ]]; then
            first=$(python -m pip index versions localcode 2>/dev/null | head -1)
            echo "default install resolves: $first"
            [ "$first" != "localcode ($version)" ] || { echo "::error::pre-release $version is the default install"; exit 1; }
          fi
      - name: Installed package, localcode doctor
        if: matrix.installer == 'pip'
        run: |
          mkdir -p "$PUBLISHED_WORK/home"
          env -i PATH="$PATH" HOME="$PUBLISHED_WORK/home" XDG_CONFIG_HOME="$PUBLISHED_WORK/home/.config" XDG_DATA_HOME="$PUBLISHED_WORK/home/.local/share" \
            LOCALCODE_HOME="$PUBLISHED_WORK/home/state" "$PUBLISHED_WORK/venv/bin/localcode" doctor
      - uses: actions/setup-node@v4
        if: matrix.installer == 'pip'
        with:
          node-version: "22"
      - name: Installed package, terminal snapshot suite
        if: matrix.installer == 'pip'
        # The journeys run the installed localcode-ui and the installed Python modules
        # (never this checkout's src/) in their own throwaway HOME per session.
        run: scripts/ui_e2e.sh --installed "$PUBLISHED_WORK/venv/bin/python"
      - name: Upload snapshot diffs
        if: always() && matrix.installer == 'pip'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-ui-e2e-${{ github.run_id }}
          path: tests/e2e/snapshot-diffs
          if-no-files-found: ignore
