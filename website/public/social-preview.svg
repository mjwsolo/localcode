  <text x="96" y="330" fill="#F5F7F8"
        font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="68" font-weight="600" letter-spacing="-1.5">Your coding agent.</text>
  <text x="96" y="410" fill="#5B86FF"
        font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="68" font-weight="600" letter-spacing="-1.5">On your Mac.</text>
  <text x="96" y="500" fill="#8C98A3"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
