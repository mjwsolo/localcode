  <rect x="96" y="540" width="1008" height="1" fill="#232A2D" />
  <text x="96" y="586" fill="#8C98A3"
        font-family="'Commit Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="26">pip install -U localcode</text>
</svg>
