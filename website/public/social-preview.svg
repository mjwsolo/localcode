<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="localcode — Your coding agent. On your Mac.">
  <title>localcode — Your coding agent. On your Mac.</title>
  <rect width="1200" height="630" fill="#0B0E11" />
  <rect x="0" y="0" width="1200" height="6" fill="#5B86FF" />
  <g transform="translate(96 112) scale(3.2)">
    <g fill="none" stroke="#F5F7F8" stroke-width="2.5">
      <rect x="3" y="3" width="26" height="26" />
      <rect x="9.5" y="9.5" width="13" height="13" />
    </g>
    <rect x="14.5" y="14.5" width="6" height="6" fill="#5B86FF" />
  </g>
  <text x="216" y="176" fill="#F5F7F8"
        font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
