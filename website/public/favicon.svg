<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="localcode">
  <title>localcode</title>
  <!-- Favicon treatment: graphite tile, bone rings, amber core. Fixed colours
       (no currentColor) so browser chrome renders it identically everywhere. -->
  <rect width="32" height="32" rx="6" fill="#14110F" />
  <g fill="none" stroke="#F7F4EF" stroke-width="2.5">
    <rect x="5" y="5" width="22" height="22" />
    <rect x="10.5" y="10.5" width="11" height="11" />
  </g>
  <rect x="15" y="15" width="5.5" height="5.5" fill="#FFB020" />
</svg>
