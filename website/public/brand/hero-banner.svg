<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 720" width="2400" height="720"
     role="img" aria-labelledby="lc-banner-title lc-banner-desc">
  <title id="lc-banner-title">localcode — Agentic coding. Local models. On your Mac.</title>
  <desc id="lc-banner-desc">The localcode Finder Mark and wordmark beside a terminal
    panel showing one turn: read a file, edit it, a failing test run, a second edit,
    then a passing test run. The transcript is an illustrative design preview, not a
    recorded session.</desc>

  <!--
    Product-led banner. Flat fills, orthogonal geometry, one accent hue (225).
    Deliberately absent: gradients, glow, blur, flow fields, particle meshes,
    device mockups, and any generated or stock imagery. Every mark here is
    hand-placed on a 24-unit grid.

    COLOUR RULE. #8AB4FF is the accent (hue 225) and carries the prompt sigil.
    Green is state-only: #3fcf8e marks a tool call that succeeded and the
    passing test line, #ff5a5f marks the failing one. A prompt is not a pass,
    so it is never green. This mirrors landing.css exactly.

    NOTE: the wordmark and transcript are live <text>. Convert to outlines
    before using this file as a distributed asset — see website/README.md,
    "Outlined SVG text".
  -->

  <rect width="2400" height="720" fill="#0F1113"/>
  <rect x="0" y="0" width="2400" height="5" fill="#2457e6"/>

  <!-- ── Left: mark + wordmark + one accurate claim ───────────────── -->
  <g transform="translate(120 168) scale(3)">
    <g fill="none" stroke="#F2F4F5" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M4 27V13L16 5L28 13V27Z"/>
      <path d="M11 17.5L13.5 20L11 22.5"/>
    </g>
    <rect x="17" y="17.5" width="5" height="5" fill="#8AB4FF"/>
  </g>

  <text x="240" y="232" fill="#F2F4F5"
        font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="62" font-weight="600" letter-spacing="-2">localcode</text>

  <text x="120" y="352" fill="#F2F4F5"
        font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="46" font-weight="600" letter-spacing="-1.2">Agentic coding. Local models.</text>
  <text x="120" y="424" fill="#8AB4FF"
        font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="54" font-weight="600" letter-spacing="-1.5">On your Mac.</text>

  <text x="120" y="500" fill="#8c98a3"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="27">Local models on Apple Silicon. No API key. Local inference by default.</text>

  <rect x="120" y="540" width="2" height="56" fill="#2457e6"/>
  <text x="146" y="580" fill="#F2F4F5"
        font-family="'Commit Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="27">pip install -U localcode</text>

  <!-- ── Right: the proof panel — one turn, red then green ────────── -->
  <g transform="translate(1300 96)">
    <rect x="0" y="0" width="980" height="528" rx="4" fill="#10151a" stroke="#232a2d" stroke-width="2"/>
    <rect x="0" y="0" width="980" height="52" fill="#171c21"/>
    <line x1="0" y1="52" x2="980" y2="52" stroke="#232a2d" stroke-width="2"/>
    <g fill="#5a6672">
      <rect x="22" y="22" width="9" height="9"/>
      <rect x="41" y="22" width="9" height="9"/>
      <rect x="60" y="22" width="9" height="9"/>
    </g>
    <text x="92" y="33" fill="#8c98a3" dominant-baseline="middle"
          font-family="'Commit Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19">localcode — ~/work/timeutil</text>
    <rect x="806" y="15" width="152" height="24" fill="none" stroke="#5a6672" stroke-width="1.5"/>
    <text x="882" y="28" fill="#8c98a3" text-anchor="middle" dominant-baseline="middle"
          font-family="'Commit Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" letter-spacing="1.4">DESIGN PREVIEW</text>

    <g font-family="'Commit Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <text x="30" y="104"><tspan fill="#8AB4FF">&gt;</tspan><tspan fill="#F2F4F5"> change parse_duration so it accepts "1h30m"</tspan></text>

      <text x="30" y="160"><tspan fill="#3fcf8e">•</tspan><tspan fill="#F2F4F5"> read_file</tspan><tspan fill="#8c98a3">(src/timeutil.py)</tspan></text>
      <text x="54" y="196" fill="#7b8792">handles "90m" and "2h", not compound units</text>
      <text x="30" y="232"><tspan fill="#3fcf8e">•</tspan><tspan fill="#F2F4F5"> edit_file</tspan><tspan fill="#8c98a3">(src/timeutil.py)</tspan></text>

      <text x="30" y="288"><tspan fill="#ff5a5f">×</tspan><tspan fill="#ff5a5f"> bash</tspan><tspan fill="#8c98a3">(pytest -q)</tspan></text>
      <text x="54" y="324" fill="#ff5a5f">1 failed — test_parse_duration_rejects_garbage</text>
      <text x="54" y="360" fill="#7b8792">the new regex made every unit optional</text>

      <text x="30" y="416"><tspan fill="#3fcf8e">•</tspan><tspan fill="#F2F4F5"> edit_file</tspan><tspan fill="#8c98a3">(src/timeutil.py)</tspan></text>
      <text x="30" y="452"><tspan fill="#3fcf8e">•</tspan><tspan fill="#F2F4F5"> bash</tspan><tspan fill="#8c98a3">(pytest -q)</tspan></text>
      <text x="54" y="488" fill="#3fcf8e">✓ 48 passed</text>
    </g>
  </g>
</svg>
